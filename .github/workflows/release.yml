name: Release

# Releases the version in wails.json as v<version>: by hand from main, or on a pushed tag, which must
# match it. Builds the macOS app (signed and notarized when the signing secrets are set, else signed
# ad hoc) and the Linux packages, with the update feeds internal/updates reads.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    if: github.ref_type == 'tag' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read the version
        id: version
        run: |
          VERSION="$(jq -r '.info.productVersion' wails.json)"
          TAG="v$VERSION"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "$TAG" ]; then
            echo "Tag $GITHUB_REF_NAME does not match the version $VERSION in wails.json." >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Open a draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        # A draft left by a failed run is replaced, so its notes and packages are current.
        run: |
          if [ "$(gh release view "$TAG" --json isDraft --jq '.isDraft' 2>/dev/null)" = "false" ]; then
            echo "$TAG is already published." >&2
            exit 1
          fi
          gh release delete "$TAG" --yes 2>/dev/null || true
          gh release create "$TAG" --title "AI Coding Tool $TAG" --generate-notes --draft --target "$GITHUB_SHA"

  build-mac:
    if: github.ref_type == 'tag' || github.ref == 'refs/heads/main'
    runs-on: macos-latest
    timeout-minutes: 45
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read the version
        run: |
          VERSION="$(jq -r '.info.productVersion' wails.json)"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=v$VERSION" >> "$GITHUB_ENV"
      # setup-go spends over 20 seconds copying Go into a tool cache this one-off runner never reads.
      - name: Install Go
        run: |
          FILE="go$(sed -n 's/^go //p' go.mod).darwin-arm64.tar.gz"
          SHA256="$(curl -fsSL 'https://go.dev/dl/?mode=json&include=all' | jq -r --arg file "$FILE" '.[].files[] | select(.filename == $file) | .sha256')"
          curl -fsSL -o "$RUNNER_TEMP/go.tar.gz" "https://go.dev/dl/$FILE"
          echo "$SHA256  $RUNNER_TEMP/go.tar.gz" | shasum -a 256 -c -
          tar -xzf "$RUNNER_TEMP/go.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/go/bin" >> "$GITHUB_PATH"
          echo "GOTOOLCHAIN=local" >> "$GITHUB_ENV"
      - name: Restore Go's caches
        id: go-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/Library/Caches/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: go-${{ runner.os }}-${{ runner.arch }}-
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install the renderer's dependencies
        run: npm --prefix frontend ci
      - name: Restore the dictation helper
        id: dictation-helper
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: native/bin/aic-dictation
          key: dictation-helper-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('native/dictation/Package.resolved', 'native/dictation/Package.swift', 'native/dictation/Sources/**') }}
      # The build skips a helper newer than its sources, and checkout gave the sources the current time.
      - if: steps.dictation-helper.outputs.cache-hit == 'true'
        run: touch native/bin/aic-dictation
      - name: Restore the dictation helper build
        if: steps.dictation-helper.outputs.cache-hit != 'true'
        id: dictation
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: native/dictation/.build
          key: dictation-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('native/dictation/Package.resolved', 'native/dictation/Package.swift', 'native/dictation/Sources/**') }}
          restore-keys: dictation-${{ runner.os }}-${{ runner.arch }}-
      - name: Check for signing credentials
        id: signing
        env:
          MAC_CERTIFICATE_P12: ${{ secrets.MAC_CERTIFICATE_P12 }}
          MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          if [ -n "$MAC_CERTIFICATE_P12" ] && [ -n "$MAC_CERTIFICATE_PASSWORD" ] && [ -n "$APPLE_API_KEY_P8" ] && [ -n "$APPLE_API_KEY_ID" ] && [ -n "$APPLE_API_ISSUER_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Signing secrets are not set, so the app is signed ad hoc and not notarized."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Restore signing credentials
        if: steps.signing.outputs.enabled == 'true'
        env:
          MAC_CERTIFICATE_P12: ${{ secrets.MAC_CERTIFICATE_P12 }}
          MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          umask 077
          printf '%s' "$MAC_CERTIFICATE_P12" | base64 -D > "$RUNNER_TEMP/signing.p12"
          printf '%s' "$APPLE_API_KEY_P8" | base64 -D > "$RUNNER_TEMP/apple.p8"
          SIGNING_KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          SIGNING_KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"
          echo "::add-mask::$SIGNING_KEYCHAIN_PASSWORD"
          security create-keychain -p "$SIGNING_KEYCHAIN_PASSWORD" "$SIGNING_KEYCHAIN"
          security set-keychain-settings -lut 21600 "$SIGNING_KEYCHAIN"
          security unlock-keychain -p "$SIGNING_KEYCHAIN_PASSWORD" "$SIGNING_KEYCHAIN"
          security import "$RUNNER_TEMP/signing.p12" -k "$SIGNING_KEYCHAIN" -P "$MAC_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$SIGNING_KEYCHAIN_PASSWORD" "$SIGNING_KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$SIGNING_KEYCHAIN" "$HOME/Library/Keychains/login.keychain-db"
          IDENTITY="$(security find-identity -v -p codesigning "$SIGNING_KEYCHAIN" | sed -n 's/.*"\(Developer ID Application: .*\)".*/\1/p' | head -1)"
          if [ -z "$IDENTITY" ]; then
            echo "The certificate holds no Developer ID Application identity." >&2
            exit 1
          fi
          echo "MAC_SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
      - name: Build the app
        run: zsh scripts/package-mac.sh "$RUNNER_TEMP/package"
      - name: Save Go's caches
        if: steps.go-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/Library/Caches/go-build
            ~/go/pkg/mod
          key: ${{ steps.go-cache.outputs.cache-primary-key }}
      - name: Save the dictation helper
        if: steps.dictation-helper.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: native/bin/aic-dictation
          key: ${{ steps.dictation-helper.outputs.cache-primary-key }}
      - name: Save the dictation helper build
        if: steps.dictation-helper.outputs.cache-hit != 'true' && steps.dictation.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: native/dictation/.build
          key: ${{ steps.dictation.outputs.cache-primary-key }}
      - name: Notarize the app
        if: steps.signing.outputs.enabled == 'true'
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          APP="$(ls -d "$RUNNER_TEMP"/package/*.app | head -1)"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" --key "$RUNNER_TEMP/apple.p8" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID" --wait
          xcrun stapler staple "$APP"
          rm -f "$RUNNER_TEMP/notarize.zip"
      # The disk image carries the notarized app and is not notarized itself.
      - name: Make the zip, disk image and update feed
        run: |
          APP="$(ls -d "$RUNNER_TEMP"/package/*.app | head -1)"
          NAME="AICodingTool-$VERSION-arm64"
          mkdir -p release
          ditto -c -k --sequesterRsrc --keepParent "$APP" "release/$NAME.zip" &
          ZIP=$!
          mkdir -p "$RUNNER_TEMP/dmg"
          cp -R "$APP" "$RUNNER_TEMP/dmg/"
          ln -s /Applications "$RUNNER_TEMP/dmg/Applications"
          hdiutil create -volname "$(basename "$APP" .app)" -srcfolder "$RUNNER_TEMP/dmg" -ov -format ULFO "release/$NAME.dmg"
          wait "$ZIP"
          scripts/release-feed.sh "$VERSION" "release/$NAME.zip" "release/$NAME.dmg" > release/latest-mac.yml
      - name: Remove signing credentials
        if: always()
        run: |
          SIGNING_KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          if [ -f "$SIGNING_KEYCHAIN" ]; then
            security delete-keychain "$SIGNING_KEYCHAIN"
          fi
          rm -f "$RUNNER_TEMP/signing.p12" "$RUNNER_TEMP/apple.p8"
      - name: Upload macOS packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/release-upload.sh "$TAG" release/*.zip release/*.dmg release/latest-mac.yml

  build-linux:
    if: github.ref_type == 'tag' || github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            feed: latest-linux.yml
            appimagetool_sha256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
          - arch: aarch64
            runner: ubuntu-24.04-arm
            feed: latest-linux-arm64.yml
            appimagetool_sha256: f0837e7448a0c1e4e650a93bb3e85802546e60654ef287576f46c71c126a9158
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      # Runs while the steps below set up Go and Node; "Wait for build dependencies" collects it.
      - name: Start installing build dependencies
        run: |
          # Skips man-db's index rebuild, the slowest part of an install on runners.
          sudo rm -f /var/lib/man-db/auto-update
          nohup sh -c 'sudo apt-get update -o Acquire::Languages=none && sudo apt-get install -y --no-install-recommends build-essential pkg-config file libgtk-3-dev libwebkit2gtk-4.1-dev; echo $? > "$RUNNER_TEMP/apt.status.tmp" && mv "$RUNNER_TEMP/apt.status.tmp" "$RUNNER_TEMP/apt.status"' > "$RUNNER_TEMP/apt.log" 2>&1 &
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read the version
        run: |
          VERSION="$(jq -r '.info.productVersion' wails.json)"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=v$VERSION" >> "$GITHUB_ENV"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install appimagetool
        env:
          APPIMAGETOOL_SHA256: ${{ matrix.appimagetool_sha256 }}
        run: |
          curl -fsSL -o "$RUNNER_TEMP/appimagetool" "https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-$ARCH.AppImage"
          echo "$APPIMAGETOOL_SHA256  $RUNNER_TEMP/appimagetool" | sha256sum -c -
          chmod 755 "$RUNNER_TEMP/appimagetool"
          mkdir -p "$RUNNER_TEMP/bin"
          mv "$RUNNER_TEMP/appimagetool" "$RUNNER_TEMP/bin/appimagetool"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          # Runners have no FUSE for AppImages.
          echo "APPIMAGE_EXTRACT_AND_RUN=1" >> "$GITHUB_ENV"
      - name: Install the renderer's dependencies
        run: npm --prefix frontend ci
      - name: Wait for build dependencies
        run: |
          while [ ! -f "$RUNNER_TEMP/apt.status" ]; do sleep 1; done
          cat "$RUNNER_TEMP/apt.log"
          exit "$(cat "$RUNNER_TEMP/apt.status")"
      - name: Build Linux packages
        run: bash scripts/package-linux.sh "$PWD/release"
      - name: Write the update feed
        env:
          FEED: ${{ matrix.feed }}
        run: scripts/release-feed.sh "$VERSION" release/*.AppImage release/*.deb > "release/$FEED"
      - name: Upload Linux packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FEED: ${{ matrix.feed }}
        run: scripts/release-upload.sh "$TAG" release/*.tar.gz release/*.deb release/*.AppImage "release/$FEED"

  publish:
    needs:
      - prepare
      - build-mac
      - build-linux
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
